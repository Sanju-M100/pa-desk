<style>
/* Layout: navy sidebar + sticky header + dashboard grid (main column, 300px calendar rail); sidebar becomes a drawer on phones. */
:root{
  --bg:#eef3fa; --surface:#ffffff; --surface-2:#f4f7fc; --line:#e1e8f3;
  --fg:#0e1f40; --muted:#62718c; --accent:#2563eb; --accent-fg:#ffffff; --accent-soft:#e5eeff;
  --nav:#0b1a3b; --nav-2:#16306b; --nav-fg:#dbe6fb; --nav-muted:#8ea3cc;
  --hdr:#ffffff; --shadow:0 1px 2px rgba(14,31,64,.05),0 4px 14px rgba(14,31,64,.05);
  --task:#2563eb; --task-bg:#e5eeff;
  --call:#16a34a; --call-bg:#def5e6;
  --meeting:#7c3aed; --meeting-bg:#eee6ff;
  --visit:#ea6a0c; --visit-bg:#ffeedd;
  --followup:#e5484d; --followup-bg:#fde7e8;
  --s-pending:#d62f3b; --s-pending-bg:#fde7e9;
  --s-scheduled:#2563eb; --s-scheduled-bg:#e3ecff;
  --s-progress:#a96a05; --s-progress-bg:#fff0c9;
  --s-done:#15803d; --s-done-bg:#dcf4e4;
  --sky1:#c5dbf4; --sky2:#eef4fc; --m1:#9db9de; --m2:#7f9fc9; --m3:#6485b3;
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:"Sora","Plus Jakarta Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#091126; --surface:#101b36; --surface-2:#0c1630; --line:#1e2d4f;
  --fg:#e7eefc; --muted:#8fa1c4; --accent:#4d8bff; --accent-fg:#06122c; --accent-soft:#16294f;
  --nav:#07122c; --nav-2:#16306b; --hdr:#0d1830; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  --task:#5b9bff; --task-bg:#15284d;
  --call:#3ec97a; --call-bg:#12301f;
  --meeting:#a98bff; --meeting-bg:#251c4a;
  --visit:#ff9b4d; --visit-bg:#3a2210;
  --followup:#ff7378; --followup-bg:#3b1a1d;
  --s-pending:#ff8087; --s-pending-bg:#3b1a1d;
  --s-scheduled:#7db0ff; --s-scheduled-bg:#16294f;
  --s-progress:#f2b94b; --s-progress-bg:#3a2d0c;
  --s-done:#52d58a; --s-done-bg:#12301f;
  --sky1:#16284d; --sky2:#1d3563; --m1:#27447a; --m2:#1f386a; --m3:#182d58;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#091126; --surface:#101b36; --surface-2:#0c1630; --line:#1e2d4f;
  --fg:#e7eefc; --muted:#8fa1c4; --accent:#4d8bff; --accent-fg:#06122c; --accent-soft:#16294f;
  --nav:#07122c; --nav-2:#16306b; --hdr:#0d1830; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  --task:#5b9bff; --task-bg:#15284d;
  --call:#3ec97a; --call-bg:#12301f;
  --meeting:#a98bff; --meeting-bg:#251c4a;
  --visit:#ff9b4d; --visit-bg:#3a2210;
  --followup:#ff7378; --followup-bg:#3b1a1d;
  --s-pending:#ff8087; --s-pending-bg:#3b1a1d;
  --s-scheduled:#7db0ff; --s-scheduled-bg:#16294f;
  --s-progress:#f2b94b; --s-progress-bg:#3a2d0c;
  --s-done:#52d58a; --s-done-bg:#12301f;
  --sky1:#16284d; --sky2:#1d3563; --m1:#27447a; --m2:#1f386a; --m3:#182d58;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--hdr)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:1.25em;height:1.25em;flex:none;display:inline-block;vertical-align:middle}
.tnum{font-variant-numeric:tabular-nums}

/* shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{background:var(--nav);color:var(--nav-fg);position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));height:calc(100dvh - env(safe-area-inset-top,0px));align-self:start;display:flex;flex-direction:column;padding:0 14px 16px max(14px,env(safe-area-inset-left,0px));z-index:30;overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;height:76px;flex:none}
.logo b{font-family:var(--display);font-size:34px;letter-spacing:-1px;background:linear-gradient(120deg,#f6a34b 0%,#4d8bff 55%,#7cc4ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.nav button{display:flex;align-items:center;gap:14px;border:0;background:transparent;color:var(--nav-fg);padding:11px 14px;border-radius:10px;font-weight:500;font-size:15px;text-align:left;width:100%}
.nav button:hover{background:rgba(255,255,255,.07)}
.nav button[aria-current="page"]{background:var(--accent);color:#fff;font-weight:600}
.nav .ic{width:20px;height:20px}
.sidefoot{margin-top:auto;border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:14px;font-size:12px;color:var(--nav-muted)}
.sidefoot strong{display:block;color:#fff;font-family:var(--display);font-size:13px;letter-spacing:.5px;margin-bottom:2px}
.sidefoot .v{display:block;color:#fff;font-size:22px;font-weight:700;margin:2px 0 0}
.sideown{margin-top:auto;padding:14px 4px 0;border-top:1px solid rgba(255,255,255,.14);font-size:12px;color:var(--nav-muted)}
.sideown b{display:block;color:#fff;font-size:15px}
.scrim{display:none}

.head{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hdr);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;min-height:76px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.burger{display:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:40px;align-items:center;justify-content:center;flex:none}
.brand{min-width:0}
.brand h1{margin:0;font-family:var(--display);font-size:25px;line-height:1.1;letter-spacing:-.3px;white-space:nowrap}
.brand h1 span{color:var(--accent)}
.brand small{display:block;font-size:10.5px;letter-spacing:.2em;color:var(--muted);font-weight:600;white-space:nowrap}
.owner{background:var(--accent-soft);border-radius:12px;padding:8px 16px;line-height:1.2;white-space:nowrap}
.owner small{display:block;font-size:11px;color:var(--muted)}
.owner b{font-size:16px}
.hsp{flex:1}
.clock{text-align:right;line-height:1.15}
.clock b{display:block;font-family:var(--display);font-size:26px;letter-spacing:-.5px}
.clock span{font-size:12px;color:var(--muted)}
.greet{display:flex;align-items:center;gap:10px;border-left:1px solid var(--line);padding-left:16px}
.greet .ic{width:38px;height:38px;color:#f5a524}
.greet b{display:block;font-size:16px}
.greet span{font-size:12px;color:var(--muted)}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--nav-2);color:#fff;display:grid;place-items:center;flex:none}

.content{padding:20px max(16px,env(safe-area-inset-right,0px)) 110px max(16px,env(safe-area-inset-left,0px));min-width:0}
@media (min-width:900px){.content{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}}
.banner{border:1px solid var(--s-progress);background:var(--s-progress-bg);color:var(--s-progress);border-radius:12px;padding:10px 14px;margin-bottom:16px;font-weight:600}
.dash{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
@media (min-width:1180px){.dash{grid-template-columns:minmax(0,1fr) 300px}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px;min-width:0}
.card h2,.pagehead h2{margin:0;font-family:var(--display);font-size:18px;letter-spacing:-.2px}
.cardhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;font-size:13.5px;min-height:40px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.ghost{color:var(--accent);border-color:var(--accent);background:transparent}
.btn.danger{color:var(--s-pending);border-color:var(--s-pending)}
.btn.danger.armed{background:var(--s-pending);color:#fff}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:12px}
@media (min-width:561px) and (max-width:700px){.stats{grid-template-columns:repeat(6,minmax(0,1fr))}.stat{grid-column:span 2}.stat:nth-child(n+4){grid-column:span 3}}
.stat{padding:12px 10px;gap:10px}
.stat span{font-size:12.5px;white-space:nowrap}
.stat .bx{width:40px;height:40px}
@media (max-width:560px){.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child:nth-child(odd){grid-column:1/-1}}
.ring{min-height:112px}
.stat{display:flex;align-items:center;gap:12px;border-radius:14px;padding:14px;border:0;text-align:left;min-width:0;width:100%}
.stat .bx{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:none}
.stat .bx .ic{width:24px;height:24px}
.stat b{display:block;font-family:var(--display);font-size:26px;line-height:1}
.stat span{font-size:13px;color:var(--muted)}
.k-task{background:var(--task-bg)} .k-task .bx{background:var(--task)}
.k-call{background:var(--call-bg)} .k-call .bx{background:var(--call)}
.k-meeting{background:var(--meeting-bg)} .k-meeting .bx{background:var(--meeting)}
.k-visit{background:var(--visit-bg)} .k-visit .bx{background:var(--visit)}
.k-followup{background:var(--followup-bg)} .k-followup .bx{background:var(--followup)}


.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:6px}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;white-space:nowrap;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}

.row{display:grid;grid-template-columns:78px 38px minmax(0,1fr) auto auto;align-items:center;gap:12px;padding:12px 8px 12px 12px;border-top:1px solid var(--line);border-left:3px solid var(--line);cursor:pointer;background:transparent;position:relative}
.row:first-child{border-top:0}
.row:hover{background:var(--surface-2)}
.row.t-task{border-left-color:var(--task)} .row.t-call{border-left-color:var(--call)} .row.t-meeting{border-left-color:var(--meeting)} .row.t-visit{border-left-color:var(--visit)} .row.t-followup{border-left-color:var(--followup)}
.r-time b{display:block;white-space:nowrap;font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.r-time span{font-size:12px;color:var(--muted)}
.r-ico{width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.t-task .r-ico{background:var(--task-bg);color:var(--task)} .t-call .r-ico{background:var(--call-bg);color:var(--call)} .t-meeting .r-ico{background:var(--meeting-bg);color:var(--meeting)} .t-visit .r-ico{background:var(--visit-bg);color:var(--visit)} .t-followup .r-ico{background:var(--followup-bg);color:var(--followup)}
.r-title{font-weight:700;font-size:14px;overflow-wrap:anywhere}
.r-sub{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.row.is-done .r-title{text-decoration:line-through;color:var(--muted)}
.pill{border-radius:8px;padding:4px 12px;font-size:12px;font-weight:700;white-space:nowrap}
.s-pending{background:var(--s-pending-bg);color:var(--s-pending)} .s-scheduled{background:var(--s-scheduled-bg);color:var(--s-scheduled)} .s-progress{background:var(--s-progress-bg);color:var(--s-progress)} .s-done{background:var(--s-done-bg);color:var(--s-done)}
.chk{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;color:transparent;padding:0}
.chk:hover{border-color:var(--s-done)}
.is-done .chk{background:var(--s-done);border-color:var(--s-done);color:#fff}
.ex{position:absolute;right:10px;top:4px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.empty{padding:26px 8px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);margin-bottom:4px}

.trio{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.trio .upc{grid-column:1/-1}
@media (max-width:700px){.trio{grid-template-columns:minmax(0,1fr)}}
.ring{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.ring svg{width:112px;height:112px;flex:none}
.ring .num{font-family:var(--display);font-weight:700;font-size:26px}
.legend{flex:1;min-width:140px;display:grid;gap:8px;font-size:13.5px}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:9px;height:9px;border-radius:50%;flex:none}
.legend b{margin-left:auto}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qa .btn{justify-content:center;min-height:44px;border:0;white-space:nowrap;gap:6px;padding:9px 8px;font-size:13px}
.qa .btn:last-child:nth-child(odd){grid-column:1/-1}
.q-task{background:var(--task);color:#fff} .q-call{background:var(--call);color:#fff}
.q-meeting{background:var(--meeting-bg);color:var(--meeting)} .q-visit{background:var(--visit-bg);color:var(--visit)} .q-followup{background:var(--followup-bg);color:var(--followup)}
.up{display:grid;gap:12px}
.up div{display:flex;align-items:center;gap:10px;font-size:13.5px}
.up .u-t{font-weight:700;min-width:0;overflow-wrap:anywhere}
.up .u-d{margin-left:auto;color:var(--muted);font-size:12.5px;text-align:right;white-space:nowrap}
.up .ic{width:20px;height:20px}
.c-task{color:var(--task)} .c-call{color:var(--call)} .c-meeting{color:var(--meeting)} .c-visit{color:var(--visit)} .c-followup{color:var(--followup)}

.cal .ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal .ch h2{font-size:17px}
.cal .ch div{display:flex;gap:4px}
.icb{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.cgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;text-align:center}
.cgrid .dw{font-size:12px;color:var(--muted);font-weight:600;padding:4px 0}
.cd{border:0;background:transparent;border-radius:10px;min-height:40px;padding:4px 0 2px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13.5px;font-variant-numeric:tabular-nums}

.dots{display:flex;gap:2px;height:5px}

.bigcal .cd{min-height:58px}
.periods{display:grid;gap:6px}
.per{display:flex;align-items:center;gap:12px;border-radius:12px;padding:10px 12px;border:1px solid var(--line);font-size:13.5px}
.per b{display:block}
.per span{margin-left:auto;color:var(--muted);font-size:12.5px;text-align:right}
.per .ic{width:26px;height:26px}

label.f{display:grid;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted)}

function pad(n){return (n<10?"0":"")+n}

function parse(k){var p=k.split("-").map(Number);return new Date(p[0],p[1]-1,p[2])}

function fmt12(t){if(!t)return "";var p=t.split(":").map(Number);var h=p[0]%12||12;return pad(h)+":"+pad(p[1])+" "+(p[0]<12?"AM":"PM")}
function periodOf(h){return h>=5&&h<12?"morning":h<16?"afternoon":h<20?"evening":"night"}

  return DOW3[d.getDay()]+", "+d.getDate()+" "+MON[d.getMonth()]+(d.getFullYear()!==t.getFullYear()?" "+d.getFullYear():"");
}

/* ---------- data ---------- */
/* Local fallback store: same small API as the db capability, kept in this browser. */
function makeLocalDb(){
  var KEY="padesk.v1",mem={items:{},settings:{}},subs=[],broken=false;
  try{
    localStorage.setItem("padesk.probe","1");localStorage.removeItem("padesk.probe");
    var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);if(o&&o.items)mem=o}
  }catch(e){broken=true}
  function persist(){
    if(broken)throw {code:"storage_blocked",message:"this browser is blocking storage, so entries cannot be kept after you close the page"};
    try{localStorage.setItem(KEY,JSON.stringify(mem))}
    catch(e){throw {code:"storage_failed",message:"the browser could not store the entry ("+(e&&e.name||"storage error")+"). Free some space or allow site storage"}}
  }
  function snapCol(c){var m=mem[c]||{};return {docs:Object.keys(m).map(function(id){return {id:id,exists:true,data:function(){return m[id]}}}),size:Object.keys(m).length}}
  function snapDoc(c,id){var d=(mem[c]||{})[id];return {id:id,exists:!!d,data:function(){return d}}}
  function notify(){subs.slice().forEach(function(f){f()})}
  /* write, then persist; if persisting fails, roll the change back and reject with the real reason */
  function commit(c,id,next){
    var had=Object.prototype.hasOwnProperty.call(mem[c]||{},id),prev=had?mem[c][id]:undefined;
    mem[c]=mem[c]||{};
    if(next===null)delete mem[c][id];else mem[c][id]=next;
    try{persist()}catch(e){if(had)mem[c][id]=prev;else delete mem[c][id];return Promise.reject(e)}
    notify();return Promise.resolve();
  }
  function docRef(c,id){return {
    id:id,
    set:function(d){return commit(c,id,JSON.parse(JSON.stringify(d)))},
    update:function(d){var cur=(mem[c]||{})[id];if(!cur)return Promise.reject({code:"invalid_argument",message:"that entry no longer exists"});return commit(c,id,Object.assign({},cur,JSON.parse(JSON.stringify(d))))},
    delete:function(){return commit(c,id,null)},
    onSnapshot:function(next){var f=function(){next(snapDoc(c,id))};subs.push(f);setTimeout(f,0);return function(){subs=subs.filter(function(x){return x!==f})}}
  }}
  return {
    local:true,broken:broken,
    collection:function(c){return {
      onSnapshot:function(next){var f=function(){next(snapCol(c))};subs.push(f);setTimeout(f,0);return function(){subs=subs.filter(function(x){return x!==f})}},
      doc:function(id){return docRef(c,id||("l"+Date.now().toString(36)+Math.random().toString(36).slice(2,8)))}
    }},
    doc:function(path){var q=path.split("/");return docRef(q[0],q[1])}
  };
}
/* ---------- cloud (Supabase): login, sync, reminders ---------- */
var CFG=window.PADESK_CONFIG||{};
var SB=null;
function cloudOn(){return !!(CFG.supabaseUrl&&CFG.supabaseKey)}
function lead(){var l=st.settings&&st.settings.lead;return l===undefined||l===null||l===""||isNaN(Number(l))?10:Number(l)}
function remindFor(d,mins){
  if(!d||!d.date||!d.time||d.status==="done")return null;
  var ev=Date.parse(d.date+"T"+d.time+":00+05:30");if(isNaN(ev))return null;
  var r=ev-mins*60000;return r<=Date.now()?null:new Date(r).toISOString();
}
function friendlyErr(e){
  var m=(e&&(e.message||e.error_description||e.msg||e.code))||String(e||"unknown error");
  if(!navigator.onLine||/failed to fetch|networkerror|load failed|network request failed/i.test(m))return "no internet connection. Check your network and try again";
  return m;
}
function newId(){try{if(window.crypto&&crypto.randomUUID)return crypto.randomUUID()}catch(e){}return "i"+Date.now().toString(36)+Math.random().toString(36).slice(2,10)}

function makeCloudDb(uid){
  var cache={items:{},rem:{},profile:null},subs=[],psubs=[],CK="padesk.cloud."+uid;
  try{var raw=localStorage.getItem(CK);if(raw){var o=JSON.parse(raw);if(o&&o.items){cache.items=o.items;cache.profile=o.profile||null}}}catch(e){}
  function save(){try{localStorage.setItem(CK,JSON.stringify({items:cache.items,profile:cache.profile}))}catch(e){}}
  function fire(){subs.slice().forEach(function(f){f()})}
  function firePr(){psubs.slice().forEach(function(f){f()})}
  var wseq=0,wflight=0;
  function clean(d){return JSON.parse(JSON.stringify(d))}
  function same(a,b){return ['type','title','person','note','date','time','status','priority'].every(function(k){return String(a&&a[k]||'')===String(b&&b[k]||'')})}
  function track(p){wflight++;wseq++;return p.then(function(r){wflight--;wseq++;return r},function(e){wflight--;wseq++;throw e})}
  function mkErr(e){return {code:(e&&e.code)||"cloud",message:friendlyErr(e)}}
  function wrap(p){return Promise.resolve(p).then(function(r){if(r&&r.error)throw mkErr(r.error);return r},function(e){throw mkErr(e)})}
  function nowIso(){return new Date().toISOString()}
  function snapCol(){var ids=Object.keys(cache.items);return {docs:ids.map(function(id){return {id:id,exists:true,data:function(){return cache.items[id]}}}),size:ids.length}}
  function snapProfile(){var p=cache.profile;return {exists:!!p,data:function(){return p}}}
  function itemRef(id){return {
    id:id,
    set:function(d){
      d=clean(d);var rm=remindFor(d,lead());
      return track(wrap(SB.from("items").upsert({user_id:uid,id:id,data:d,remind_at:rm,reminded:false,updated_at:nowIso()},{onConflict:"user_id,id"}).select("id,data"))).then(function(r){
        var got=r&&r.data&&r.data[0];if(got&&!same(got.data,d))throw {code:"mismatch",message:"the server kept older data for this entry. Reload the page and try again"};
        cache.items[id]=(got&&got.data)||d;cache.rem[id]=rm;save();fire()});
    },
    update:function(p){
      var cur=cache.items[id];if(!cur)return Promise.reject({code:"invalid_argument",message:"that entry no longer exists"});
      var next=Object.assign({},cur,clean(p)),row={data:next,updated_at:nowIso()},rm;
      if(cur.date!==next.date||cur.time!==next.time||cur.status!==next.status){rm=remindFor(next,lead());row.remind_at=rm;row.reminded=false}
      return track(wrap(SB.from("items").update(row).eq("id",id).select("id,data"))).then(function(r){
        if(!r.data||!r.data.length)throw {code:"gone",message:"that entry no longer exists on the server"};
        if(!same(r.data[0].data,next))throw {code:"mismatch",message:"the server kept older data for this entry. Reload the page and try again"};
        cache.items[id]=r.data[0].data;if(row.remind_at!==undefined)cache.rem[id]=rm;save();fire();
      });
    },
    delete:function(){return wrap(SB.from("items").delete().eq("id",id)).then(function(){delete cache.items[id];delete cache.rem[id];save();fire()})},
    onSnapshot:function(next){var f=function(){next({id:id,exists:!!cache.items[id],data:function(){return cache.items[id]}})};subs.push(f);setTimeout(f,0);return function(){subs=subs.filter(function(x){return x!==f})}}
  }}
  function profileRef(){return {
    set:function(d){d=clean(d);return wrap(SB.from("profiles").upsert({user_id:uid,data:d,updated_at:nowIso()},{onConflict:"user_id"})).then(function(){cache.profile=d;save();firePr()})},
    onSnapshot:function(next){var f=function(){next(snapProfile())};psubs.push(f);setTimeout(f,0);return function(){psubs=psubs.filter(function(x){return x!==f})}}
  }}
  var db={
    cloud:true,
    collection:function(c){return {
      onSnapshot:function(next){var f=function(){next(snapCol())};subs.push(f);setTimeout(f,0);return function(){subs=subs.filter(function(x){return x!==f})}},
      doc:function(id){return itemRef(id||newId())}
    }},
    doc:function(path){var q=path.split("/");return q[0]==="items"?itemRef(q[1]):profileRef()},
    refresh:function(){
      var s0=wseq;
      return wrap(SB.from("items").select("id,data,remind_at").limit(10000)).then(function(r){
        if(wflight>0||wseq!==s0){return new Promise(function(res){setTimeout(function(){res(db.refresh())},600)})} /* a save happened meanwhile: do not overwrite it with older data */
        var m={},rem={};(r.data||[]).forEach(function(x){m[x.id]=x.data||{};rem[x.id]=x.remind_at||null});
        cache.items=m;cache.rem=rem;save();fire();
      });
    },
    refreshProfile:function(){
      return wrap(SB.from("profiles").select("data").limit(1)).then(function(r){cache.profile=r.data&&r.data[0]?r.data[0].data:null;save();firePr()});
    },
    /* after the "remind me" lead time changes, move every upcoming reminder */
    recomputeReminders:function(){
      var rows=[];Object.keys(cache.items).forEach(function(id){
        var d=cache.items[id],rm=remindFor(d,lead());
        if(rm!==(cache.rem[id]||null)&&(rm||cache.rem[id]&&new Date(cache.rem[id]).getTime()>Date.now()))rows.push({user_id:uid,id:id,data:d,remind_at:rm,reminded:false,updated_at:nowIso()});
      });
      if(!rows.length)return Promise.resolve(0);
      return wrap(SB.from("items").upsert(rows,{onConflict:"user_id,id"})).then(function(){rows.forEach(function(r){cache.rem[r.id]=r.remind_at});save();return rows.length});
    },
    /* restore from a backup file: keeps ids, so importing the same file twice does not duplicate anything */
    importMany:function(list){
      var rows=list.map(function(d){var id=d.id||newId(),c=clean(d);delete c.id;return {user_id:uid,id:String(id),data:c,remind_at:remindFor(c,lead()),reminded:false,updated_at:nowIso()}});
      var chunks=[];for(var i=0;i<rows.length;i+=200)chunks.push(rows.slice(i,i+200));
      return chunks.reduce(function(p,ch){return p.then(function(){return wrap(SB.from("items").upsert(ch,{onConflict:"user_id,id"}))})},Promise.resolve()).then(function(){
        rows.forEach(function(r){cache.items[r.id]=r.data;cache.rem[r.id]=r.remind_at});save();fire();return rows.length});
    },
    subscribe:function(){
      try{SB.channel("pa-"+uid)
        .on("postgres_changes",{event:"*",schema:"public",table:"items",filter:"user_id=eq."+uid},function(){db.refresh().catch(function(){})})
        .on("postgres_changes",{event:"*",schema:"public",table:"profiles",filter:"user_id=eq."+uid},function(){db.refreshProfile().catch(function(){})})
        .subscribe()}catch(e){}
    },
    forget:function(){try{localStorage.removeItem(CK)}catch(e){}}
  };
  return db;
}

function showAuth(msg,opts){

    var mg=$("#auMsg");mg.textContent=st.auth.msg;mg.className="authmsg"+(st.auth.ok?" ok":"");

function submitAuth(){

  if(m!=="forgot"&&(pass||"").length<8){showAuth("Password needs at least 8 characters.");return}
  st.auth.busy=true;showAuth("");

  else if(m==="forgot")p=SB.auth.resetPasswordForEmail(email,{redirectTo:back});

  Promise.resolve(p).then(function(r){
    st.auth.busy=false;

    if(m==="signin")return;                                  /* the SIGNED_IN event starts the app */
    if(m==="signup"){
      if(r.data&&r.data.session)return;

function startCloud(user){

  try{localStorage.setItem("padesk.lastuser",JSON.stringify({id:user.id,email:user.email||""}))}catch(e){}
  var db=makeCloudDb(user.id);st.db=db;st.canWrite=true;st.dbMsg="";
  db.collection("items").onSnapshot(function(s){st.items=s.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o});rerender()});
  db.doc("settings/profile").onSnapshot(function(s){
    var d=s.exists?s.data():{},nm=(user.email||"").split("@")[0].replace(/[._\-\d]+/g," ").trim().split(" ")[0];nm=nm?cap(nm):"there";
    st.settings={name:d.name||nm,owner:d.owner||d.name||nm,lead:d.lead===undefined?10:d.lead};rerender();
  });

/* ---------- quick capture parser (English + Hinglish, India time) ---------- */
var WD={sun:0,sunday:0,ravivar:0,itwaar:0,itwar:0,mon:1,monday:1,somvar:1,tue:2,tues:2,tuesday:2,mangalvar:2,wed:3,wednesday:3,budhvar:3,thu:4,thur:4,thurs:4,thursday:4,guruvar:4,veervar:4,fri:5,friday:5,shukravar:5,shukrawar:5,sat:6,saturday:6,shanivar:6,shaniwar:6};

var CUES={
  call:[[/\b(?:call|calling|phone|ring|dial)\b(?!\s*(?:recharge|repair|bill|cover|case|number))/i,4],[/\bbaat\s+kar\w*/i,3],[/\bbulana\b/i,2]],

function nameCase(s){return s.split(/\s+/).map(function(w,i,a){return /^(ji|sir|saab|sahab|sahib|bhai|bhaiya|madam|mam|maam|didi)$/i.test(w)?w.toLowerCase():(/^[A-Z]{2,4}$/.test(w)?w:w.charAt(0).toUpperCase()+w.slice(1))}).join(" ")}
function isNameTok(w){return !!w&&!NAMESTOP.test(w)&&!NOTPERSON.test(w)&&!new RegExp("^("+WDRE+")$","i").test(w)&&!/\d/.test(w)}
function removeSpan(t,txt){return t.replace(new RegExp(txt.trim().split(/\s+/).map(escRe).join("\\s+"),"i")," ")}
function findPerson(t,type){
  var m,toks,name,i;
  /* 1. Name + honorific: "Vijay sir", "Mehta ji" */
  m=t.match(/([A-Za-z][A-Za-z.'-]*)(?:\s+([A-Za-z][A-Za-z.'-]*))?\s+(ji|sir|saab|sahab|sahib|bhai|bhaiya|madam|mam|maam|didi)\b/i);
  if(m){
    toks=[m[1],m[2]].filter(Boolean);
    while(toks.length&&!isNameTok(toks[0]))toks.shift();
    if(toks.length){name=toks.join(" ")+" "+m[3];return {name:nameCase(name),rest:removeSpan(t,name)}}
  }
  /* 2. "<Name> ko / se / ke saath ..." (Hinglish) */
  m=t.match(/([A-Za-z][A-Za-z.'-]*(?:\s+[A-Za-z][A-Za-z.'-]*)?)\s+(?:ko|se|ke\s+saath|ke\s+sath|ke\s+sang)\b/i);
  if(m){
    toks=m[1].split(/\s+/);var pick=[];
    for(i=toks.length-1;i>=0;i--){
      if(!isNameTok(toks[i]))break;
      if(pick.length===1&&!/^[A-Z]/.test(toks[i]))break;
      pick.unshift(toks[i]);if(pick.length===2)break;
    }
    if(pick.length&&(type!=="task"||ROLERE.test(pick[pick.length-1])||/^[A-Z]/.test(pick[0]))){
      var txt=pick.join(" ");
      return {name:nameCase(txt),rest:t.replace(new RegExp(pick.map(escRe).join("\\s+")+"\\s+(?:ko|se|ke\\s+saath|ke\\s+sath|ke\\s+sang)\\b","i")," ")};
    }
  }
  /* 3. "with / meet / call <Name>" */
  m=t.match(/\b(?:with|meet|call|phone|ring|ping|email|mail|visit)\s+([A-Za-z][A-Za-z.'-]*)(?:\s+([A-Za-z][A-Za-z.'-]*))?/i);
  if(m&&isNameTok(m[1])&&(/^[A-Z]/.test(m[1])||ROLERE.test(m[1]))){
    var nm=m[1];if(m[2]&&isNameTok(m[2])&&/^[A-Z]/.test(m[2])&&/^[A-Z]/.test(m[1]))nm+=" "+m[2];

  }
  /* 4. A leading role or short ALL-CAPS word before the cue: "GM meeting", "HR call" */

  return {name:"",rest:t};
}
function inferHour(h,period){
  if(h===12)return period==="night"?0:12;
  if(period==="morning")return h;
  if(period==="afternoon")return h<=6?h+12:h;
  if(period==="evening")return h<=11?h+12:h;
  if(period==="night")return h>=6?h+12:h;
  return h<=6?h+12:h;
}
function extractPeriod(s){
  var m,p="";
  if((m=s.match(/\b(?:subah|subha|savere|morning)\b/i)))p="morning";
  else if((m=s.match(/\b(?:dopahar|dophar|afternoon)\b/i)))p="afternoon";
  else if((m=s.match(/\b(?:shaam|sham|sandhya|evening)\b/i)))p="evening";
  else if((m=s.match(/\b(?:raat|tonight|night)\b/i)))p="night";
  if(!p)return {period:"",s:s,tonight:false};
  var tonight=/\btonight\b/i.test(s);
  s=s.replace(/\b(?:subah|subha|savere|morning|dopahar|dophar|afternoon|shaam|sham|sandhya|evening|raat|tonight|night)\b/ig," ");
  return {period:p,s:s,tonight:tonight};
}
function extractTime(s,period){
  var m,h,mi,res={time:"",assumed:false,s:s};
  function set(hh,mm,assumed){res.time=pad(hh)+":"+pad(mm);res.assumed=!!assumed}
  if((m=s.match(/\b(?:at\s+|around\s+|by\s+)?(\d{1,2})(?:[:.](\d{2}))?\s*(?:baje|bje|bajey|o'?clock)?\s*(a\.?m\.?|p\.?m\.?)(?![A-Za-z])/i))){
    h=+m[1];mi=m[2]?+m[2]:0;
    if(h>=1&&h<=12&&mi<60){set(h%12+(/^p/i.test(m[3])?12:0),mi,false);res.s=s.replace(m[0]," ");return res}
  }
  if((m=s.match(/\b(0?\d|1\d|2[0-3]):([0-5]\d)\b/))){
    h=+m[1];mi=+m[2];
    if(/^0/.test(m[1])||h>=10||h===0){set(h,mi,false)}
    else{set(inferHour(h,period),mi,!period)}
    res.s=s.replace(m[0]," ");return res;
  }
  if((m=s.match(/\b(?:at\s+)?(\d{1,2})(?:[:.](\d{2}))?\s*(?:baje|bje|bajey|o'?clock)\b/i))){
    h=+m[1];mi=m[2]?+m[2]:0;
    if(h>=0&&h<=23&&mi<60){set(h>12||h===0?h:inferHour(h,period),mi,h<=12&&h>0&&!period);res.s=s.replace(m[0]," ");return res}
  }
  if((m=s.match(/\bat\s+(\d{1,2})(?:[:.](\d{2}))?\b(?!\s*(?:am|pm|:))/i))){
    h=+m[1];mi=m[2]?+m[2]:0;
    if(h>=1&&h<=12&&mi<60){set(inferHour(h,period),mi,!period);res.s=s.replace(m[0]," ");return res}
  }
  if((m=s.match(/\bnoon\b/i))){set(12,0,false);res.s=s.replace(m[0]," ");return res}
  if((m=s.match(/\bmidnight\b/i))){set(0,0,false);res.s=s.replace(m[0]," ");return res}
  return res;
}
function extractDate(s,base){
  var m,res={date:null,s:s,ambiguous:false,alts:[]},dow=base.getDay();
  var fin=function(d,mm){res.date=d;res.s=s.replace(mm," ");return res};
  if((m=s.match(new RegExp("\\b(\\d{1,2})(?:st|nd|rd|th)?\\s+(?:of\\s+)?("+MONRE+")\\b(?:,?\\s+(\\d{4}))?","i")))&&+m[1]>=1&&+m[1]<=31){
    var y=m[3]?+m[3]:base.getFullYear(),d1=new Date(y,monIndex(m[2]),+m[1]);
    if(!m[3]&&d1<base)d1=new Date(y+1,monIndex(m[2]),+m[1]);return fin(d1,m[0]);
  }
  if((m=s.match(new RegExp("\\b("+MONRE+")\\s+(\\d{1,2})(?:st|nd|rd|th)?\\b(?:,?\\s+(\\d{4}))?","i")))&&+m[2]>=1&&+m[2]<=31){
    var y2=m[3]?+m[3]:base.getFullYear(),d2=new Date(y2,monIndex(m[1]),+m[2]);
    if(!m[3]&&d2<base)d2=new Date(y2+1,monIndex(m[1]),+m[2]);return fin(d2,m[0]);
  }
  if((m=s.match(/\b(\d{1,2})[\/-](\d{1,2})(?:[\/-](\d{2,4}))?\b/))&&+m[1]>=1&&+m[1]<=31&&+m[2]>=1&&+m[2]<=12){
    var y3=m[3]?(+m[3]<100?2000+ +m[3]:+m[3]):base.getFullYear(),d3=new Date(y3,+m[2]-1,+m[1]);
    if(!m[3]&&d3<base)d3=new Date(y3+1,+m[2]-1,+m[1]);return fin(d3,m[0]);
  }
  if((m=s.match(/\bday\s+after\s+tomorrow\b|\bparson?\b/i)))return fin(addDays(base,2),m[0]);
  if((m=s.match(/\b(?:tomorrow|tmrw|tmr|tommorow|kal)\b/i)))return fin(addDays(base,1),m[0]);
  if((m=s.match(/\b(?:today|aaj)\b/i)))return fin(base,m[0]);
  if((m=s.match(/\bin\s+(\d{1,2})\s+days?\b|\b(\d{1,2})\s+din\s+(?:baad|mein|me)\b/i)))return fin(addDays(base,+(m[1]||m[2])),m[0]);
  if((m=s.match(/\bnext\s+week\b|\bagle\s+hafte\b/i)))return fin(addDays(base,7),m[0]);
  if((m=s.match(new RegExp("\\b(next|this|coming|agle|agla)?\\s*\\b("+WDRE+")\\b(?:\\s+ko\\b)?","i")))){
    var idx=WD[m[2].toLowerCase()],diff=(idx-dow+7)%7,q=(m[1]||"").toLowerCase();
    if(diff===0){
      if(q==="this"){diff=0}
      else if(q){diff=7}
      else{
        res.ambiguous=true;
        res.alts=[{label:"Today",date:base},{label:"Next "+DOW[idx],date:addDays(base,7)}];
        diff=0;
      }
    }
    return fin(addDays(base,diff),m[0]);
  }
  return res;
}
function parseCapture(raw,base){
  var text=String(raw||"").replace(/\s+/g," ").trim();
  var out={raw:text,type:"task",conf:"low",title:"",person:"",note:"",date:"",time:"",period:"",priority:"medium",hints:[],alts:[],dateAmbiguous:false,timeAssumed:false,noCue:false,needsConfirm:false};
  if(!text)return out;
  var norm=text.replace(/follow[\s-]*ups?\b/ig,"followup");
  /* 1. category by weighted cues */
  var scores={},best="task",top=0,second=0;
  TYPE_KEYS.forEach(function(t){var sc=0;(CUES[t]||[]).forEach(function(c){if(c[0].test(norm))sc+=c[1]});scores[t]=sc});
  var order=TYPE_KEYS.slice().sort(function(a,b){return scores[b]-scores[a]});
  top=scores[order[0]];second=scores[order[1]];
  if(top>0){best=order[0];out.conf=(top>=3&&top-second>=2)?"high":"low"}else{out.noCue=true}
  out.type=best;
  var s=norm;
  /* 2. priority */
  if(/!{2,}|\b(?:urgent|asap|important|critical|high\s+priority|jaruri|zaruri|jaroori|turant)\b/i.test(s)){out.priority="high";s=s.replace(/!{2,}|\b(?:urgent|asap|important|critical|high\s+priority|jaruri|zaruri|jaroori|turant)\b/ig," ")}
  else if(/\b(?:low\s+priority|whenever|someday|aaram\s+se)\b/i.test(s)){out.priority="low";s=s.replace(/\b(?:low\s+priority|whenever|someday|aaram\s+se)\b/ig," ")}
  s=s.replace(/\b(?:medium|normal)\s+priority\b/ig," ");
  /* 3. date, period, time */
  var dr=extractDate(s,base);s=dr.s;
  var pr=extractPeriod(s);s=pr.s;
  var tr=extractTime(s,pr.period);s=tr.s;
  var date=dr.date;
  if(!date&&pr.tonight)date=base;
  out.date=date?ymd(date):"";
  out.time=tr.time;
  out.period=tr.time?"":pr.period;
  out.timeAssumed=tr.assumed;
  out.dateAmbiguous=dr.ambiguous;out.alts=dr.alts.map(function(a){return {label:a.label+" ("+DOW3[a.date.getDay()]+", "+a.date.getDate()+" "+MON[a.date.getMonth()]+")",date:ymd(a.date)}});
  /* 4. person */
  s=s.replace(/\s+/g," ").trim();
  var fp=findPerson(s,out.type);out.person=fp.name;s=fp.rest;
  /* 5. note + title */
  s=s.replace(/\s+/g," ").trim();
  var note="",nm=s.match(/^(.*?)\b(?:about|regarding|re:|baare\s+mein|bare\s+mein|ke\s+baare\s+mein|ke\s+bare\s+mein|ke\s+liye|for)\b\s*(.*)$/i);
  if(nm&&nm[1].replace(/[\W_]+/g,"").length>0){s=nm[1];note=nm[2]}
  var clean=function(x){
    x=x.replace(/\b(?:ko|se|ke\s+saath|ke\s+sath|ke\s+sang|ka|ki|ke|hai|hain|tha|please|pls|plz|zara|zaroor)\b/ig," ").replace(/[@,;]+/g," ").replace(/\s+/g," ").trim();
    for(var i=0;i<4;i++)x=x.replace(/^(?:with|to|and|on|at|by|in|for|of|the|a)\s+/i,"").replace(/\s+(?:with|to|and|on|at|by|in|for|of|the|a)$/i,"").replace(/^[\s.:\-–]+|[\s.:\-–]+$/g,"");
    return x;
  };
  s=clean(s);note=clean(note);
  var restNoCue=clean(s.replace(CUESTRIP[out.type]||/(?!)/g," "));
  var hasContent=restNoCue.replace(/[\W_]+/g,"").length>0;
  var P=out.person,title="";
  var withDisc=/\bdiscussion\b/i.test(norm)&&!/\bmeeting\b/i.test(norm);
  if(out.type==="call"){
    if(P){title="Call "+P;if(hasContent&&!note)note=cap(restNoCue)}
    else title=hasContent?"Call "+restNoCue:"Call";
  }else if(out.type==="meeting"){
    title=hasContent?cap(s):(P?(withDisc?"Discussion with ":"Meeting with ")+P:(withDisc?"Discussion":"Meeting"));
  }else if(out.type==="followup"){
    title=hasContent?cap(s):(P?"Follow-up with "+P:"Follow-up");
  }else if(out.type==="visit"){
    title=hasContent?cap(s):(P?"Visit "+P:"Visit");
  }else{
    title=s?cap(s):"Task";
  }
  out.title=title.replace(/\bfollowup\b/ig,"follow-up").replace(/^(Follow-up)\b/,"Follow-up");
  out.note=note?cap(note):"";
  /* 6. hints that need a look before saving */
  if(out.noCue)out.hints.push("No category word found. It will be saved as a Task unless you change the category.");
  else if(out.conf==="low")out.hints.push("Not fully sure about the category. Please check it.");
  if(out.dateAmbiguous)out.hints.push("That weekday is today. Choose the date you mean.");
  if(out.timeAssumed)out.hints.push("No AM/PM was given, so "+fmt12(out.time)+" was assumed. Edit the time if that is wrong.");
  out.needsConfirm=out.conf==="low"||out.dateAmbiguous;
  return out;
}
function decorate(rec){
  rec.weekday=rec.date?DOW[parse(rec.date).getDay()]:"";
  rec.ampm=rec.time?(+rec.time.slice(0,2)<12?"AM":"PM"):"";
  return rec;
}
function timeLabel(it){return it.time?fmt12(it.time):(it.period?cap(it.period):"")}

function qcMsg(kind,html){
  var el=$("#qcMsg");if(!el)return;
  el.className=html?"qmsg "+kind:"";el.setAttribute("role",kind==="err"?"alert":"status");el.innerHTML=html||"";

function doCapture(){
  var inp=$("#qc"),q=st.qc,raw=inp.value.trim();
  if(q.saving)return;
  if(!raw){qcMsg("err","Type a note first, for example “Vijay sir ko call kal 3 baje”.");inp.focus();return}
  if(!q.parsed||q.parsed.raw!==raw.replace(/\s+/g," "))qcParse();
  var f=qcFinal();
  if(!f.title||f.title.replace(/\W+/g,"").length<2){qcMsg("err","Could not make a title from that note. Add a few more words or edit the title.");q.edit=true;qcRenderPreview();return}
  if(qcNeedsConfirm()&&!q.confirmed){
    q.confirmed=true;qcRenderPreview();
    qcMsg("warn","Please check the highlighted details, then press Add again.");return;
  }
  if(!st.db||!st.canWrite){qcMsg("err",st.canWrite?"Storage is not connected yet. Wait a moment and press Add again. Your note is still here.":"This view is read-only, so nothing can be saved.");return}
  var rec=decorate({type:f.type,title:f.title.trim(),person:(f.person||"").trim(),note:f.note||"",date:f.date||"",time:f.time||"",period:f.period||"",priority:f.priority||"medium",status:defStatus(f.type),doneDate:"",raw:raw,createdAt:Date.now()});
  var T=TYPES[rec.type]||TYPES.task,btn=$('[data-act="qcgo"]');
  q.saving=true;if(btn)btn.disabled=true;qcMsg("warn","Saving…");
  var ref;
  Promise.resolve().then(function(){ref=st.db.collection("items").doc();return ref.set(rec)}).then(function(){
    st.hl=ref.id;st.pulse=rec.type;
    if(!st.items.some(function(x){return x.id===ref.id})){var o=Object.assign({id:ref.id},rec);st.items.push(o)}
    inp.value="";st.qc.parsed=null;st.qc.ov={};st.qc.edit=false;st.qc.confirmed=false;
    qcRenderPreview();
    var when=rec.date?DOW3[parse(rec.date).getDay()]+", "+shortDay(rec.date)+(rec.time?", "+fmt12(rec.time):(rec.period?", "+cap(rec.period):"")):"No date set";
    qcMsg("ok",ico("i-check")+'<span>'+esc(T.label)+' added successfully · '+esc(when)+'</span><button class="lnk" type="button" data-act="nav" data-v="'+T.hash+'">View '+esc(T.plural)+'</button>');
    render();
    clearTimeout(qcMsg.t);qcMsg.t=setTimeout(function(){st.hl=null;st.pulse=null;render()},6000);
    inp.focus();
  }).catch(function(e){
    var why=(e&&(e.message||e.code))||String(e||"unknown error");
    qcMsg("err","Not saved: "+esc(why)+". Your note is still in the box. Press Add to try again.");
  }).then(function(){q.saving=false;if(btn)btn.disabled=false});
}

/* ---------- calendar widget ---------- */
function monthGrid(y,m){
  var first=new Date(y,m,1),start=first.getDay(),dim=new Date(y,m+1,0).getDate(),pd=new Date(y,m,0).getDate(),cells=[],i,d,dt,out;
  for(i=0;i<42;i++){d=i-start+1;out=false;
    if(d<1){dt=new Date(y,m-1,pd+d);out=true}else if(d>dim){dt=new Date(y,m+1,d-dim);out=true}else dt=new Date(y,m,d);
    cells.push({k:ymd(dt),n:dt.getDate(),out:out})}
  if(cells.slice(35).every(function(c){return c.out}))cells=cells.slice(0,35);
  var by={};st.items.forEach(function(it){(by[it.date]=by[it.date]||{})[it.type]=1});
  var today=ymd(nowIST());
  var h='<div class="cgrid">'+DOW3.map(function(n){return '<div class="dw">'+n+'</div>'}).join("");
  cells.forEach(function(c){
    var dots=Object.keys(by[c.k]||{}).slice(0,3).map(function(t){return '<i class="c-'+t+'"></i>'}).join("");
    h+='<button class="cd'+(c.out?" out":"")+(c.k===today?" today":"")+(c.k===st.sel?" sel":"")+'" data-act="sel" data-d="'+c.k+'" aria-label="'+esc(longDate(parse(c.k)))+'"><span>'+c.n+'</span><span class="dots">'+dots+'</span></button>';
  });
  return h+'</div>';
}
function calCard(){

    '<button class="icb" data-act="calnav" data-d="1" aria-label="Next month">'+ico("i-right")+'</button></div></div>'+monthGrid(st.cal.y,st.cal.m)+'</section>';
}

    (per==="night"?'<mask id="mk"><rect width="800" height="200" fill="#fff"/><circle cx="514" cy="47" r="22" fill="#000"/></mask>':"")+
    '</defs><rect width="800" height="200" fill="url(#sky)"/>';

  else if(per==="afternoon"){h+='<circle cx="500" cy="52" r="90" fill="url(#glow)"/><circle cx="500" cy="52" r="28" fill="#ffe066"/>'+cloud(110,52,1.2,.95,"#fff")+cloud(360,34,1,.9,"#fff")+cloud(520,84,.9,.85,"#fff")+cloud(740,108,.8,.8,"#fff")}
  else if(per==="evening"){h+='<circle cx="500" cy="142" r="140" fill="url(#glow)"/><circle cx="500" cy="142" r="46" fill="#ffd08a"/>'+cloud(200,76,1.5,.4,"#ff9a7a")+cloud(430,52,1.2,.4,"#ff9a7a")+cloud(740,40,1,.3,"#c4709a")}
  else{
    h+='<circle cx="500" cy="56" r="80" fill="url(#glow)"/><circle cx="500" cy="56" r="26" fill="#f4f1de" mask="url(#mk)"/>'+cloud(180,64,1.4,.3,"#4a5a98")+cloud(450,40,1.1,.28,"#4a5a98");
    var seed=7,r=function(){seed=(seed*9301+49297)%233280;return seed/233280};
    for(var i=0;i<30;i++){var x=Math.round(r()*790+5),y=Math.round(r()*115+6),rad=(r()*1.1+.5).toFixed(1);h+='<circle class="star" cx="'+x+'" cy="'+y+'" r="'+rad+'" fill="#fff" opacity="'+(r()*.5+.45).toFixed(2)+'" style="animation-delay:'+(r()*3).toFixed(1)+'s"/>'}
  }
  h+='<path transform="translate(0 95)" d="M0 120V70l90-34 70 28 90-46 100 56 80-30 110 42 90-38 170 46v66z" style="fill:var(--m1)"/><path transform="translate(0 97)" d="M0 120V92l120-30 80 24 120-38 110 46 100-26 120 30 150-22v64z" style="fill:var(--m2)"/><path transform="translate(0 99)" d="M0 120v-14l140-18 120 14 150-22 130 20 140-14 120 12v22z" style="fill:var(--m3)"/></svg>';
  return h;
}

  var ring='<section class="card"><div class="cardhead"><h2>'+(isToday?"Today’s":"Day’s")+' Progress</h2></div><div class="ring"><svg viewBox="0 0 112 112" role="img" aria-label="'+done+' of '+day.length+' completed"><circle cx="56" cy="56" r="44" fill="none" stroke="var(--line)" stroke-width="10"/><circle cx="56" cy="56" r="44" fill="none" stroke="var(--line)" stroke-width="0"/>'+arcs+'<text x="56" y="56" text-anchor="middle" style="fill:var(--fg);font-family:var(--display);font-weight:700;font-size:24px">'+done+'/'+day.length+'</text><text x="56" y="74" text-anchor="middle" style="fill:var(--muted);font-size:11px">Completed</text></svg>'+

  var pers='<section class="card"><div class="cardhead"><h2>Time Periods</h2><span class="nowtag">Current: '+cap(per)+'</span></div><div class="periods">'+PERIODS.map(function(p){return '<div class="per'+(p.id===per?" now":"")+'">'+ico(p.icon,p.id==="morning"||p.id==="afternoon"?"c-visit":p.id==="evening"?"c-followup":"c-meeting")+'<b>'+p.label+'</b><span>'+p.range+'</span></div>'}).join("")+'</div></section>';
  return '<div class="dash"><div class="col"><div class="stats">'+stats+'</div>'+attn+sched+'<div class="trio">'+ring+qa+upc+'</div></div><div class="col">'+calCard()+pers+'</div></div>';

/* ---------- reports & history ---------- */
function rpRange(){
  var r=st.rp;
  if(r.mode==="single")return [r.date,r.date];
  if(r.mode==="range")return r.from<=r.to?[r.from,r.to]:[r.to,r.from];
  if(r.mode==="month"){var p=r.month.split("-").map(Number);return [r.month+"-01",r.month+"-"+pad(new Date(p[0],p[1],0).getDate())]}
  return [r.year+"-01-01",r.year+"-12-31"];
}
function rpLabel(){
  var r=st.rp,g=rpRange();
  if(r.mode==="single")return shortDate(r.date);
  if(r.mode==="range")return shortDate(g[0])+" – "+shortDate(g[1]);
  if(r.mode==="month"){var p=r.month.split("-").map(Number);return MONL[p[1]-1]+" "+p[0]}
  return String(r.year);
}
function rpFile(){var r=st.rp,g=rpRange();return r.mode==="single"?g[0]:r.mode==="range"?g[0]+"_to_"+g[1]:r.mode==="month"?r.month:String(r.year)}
function inR(k,g){return !!k&&k>=g[0]&&k<=g[1]}
function rpRecords(){
  var g=rpRange(),r=st.rp,q=r.q.trim().toLowerCase();
  return st.items.filter(function(it){
    if(!(inR(it.date,g)||inR(it.doneDate,g)))return false;
    if(r.module!=="all"&&it.type!==r.module)return false;
    if(r.status!=="all"&&it.status!==r.status)return false;
    if(q&&((it.title||"")+" "+(it.person||"")+" "+(it.note||"")).toLowerCase().indexOf(q)<0)return false;
    return true;
  }).sort(cmp);
}
function summary(recs){
  var today=ymd(nowIST()),c=function(t){return recs.filter(function(i){return i.type===t})},d=function(l){return l.filter(function(i){return i.status==="done"}).length};
  var tasks=c("task"),calls=c("call");
  return {taskDone:d(tasks),taskPend:tasks.length-d(tasks),calls:calls.length,callsDone:d(calls),meetings:c("meeting").length,visits:c("visit").length,followups:c("followup").length,overdue:recs.filter(function(i){return i.status!=="done"&&i.date&&i.date<today}).length};
}

  var tbl=recs.length?'<div class="tblwrap"><table class="tbl"><thead><tr><th>Date</th><th>Day</th><th>Time</th><th>Module</th><th>Title</th><th>With</th><th>Details</th><th>Priority</th><th>Status</th><th>Done on</th></tr></thead><tbody>'+

    :emptyBox("No records saved for this period and filters.","Change the period or filters, or add entries from the dashboard.");
  return chips+'<section class="card" style="padding:0"><div class="cardhead" style="padding:16px 18px;margin:0;border-bottom:1px solid var(--line)"><h2>Records <span class="sub">('+recs.length+') · matched by work date or completion date</span></h2></div>'+tbl+'</section>';

    '<div class="rpf">'+period+
    '<label class="f">Module<select class="in" id="rpModule">'+opt("all","All modules",r.module)+TYPE_KEYS.map(function(t){return opt(t,TYPES[t].plural,r.module)}).join("")+'</select></label>'+

    '<div class="rpbar"><div><small>REPORTING PERIOD</small><b>'+esc(rpLabel())+'</b></div><div class="rpbtns"><button class="btn wa" data-act="plan">'+ico("i-chat")+' Morning Plan</button><button class="btn wa" data-act="wa">'+ico("i-chat")+' WhatsApp Report</button><button class="btn" data-act="xlsx">'+ico("i-table")+' Excel Report</button><button class="btn" data-act="csv">'+ico("i-file")+' CSV</button></div></div></section>'+

/* ---------- report builders ---------- */
function waText(){
  var r=st.rp,g=rpRange(),recs=rpRecords(),multi=r.mode!=="single",L=[],sm=summary(recs);
  if(r.mode==="single")L.push("*DAILY WORK REPORT*","Date: "+shortDate(r.date));
  else if(r.mode==="range")L.push("*WORK REPORT*","Period: "+rpLabel());
  else if(r.mode==="month")L.push("*MONTHLY WORK REPORT*","Month: "+rpLabel());
  else L.push("*YEARLY WORK REPORT*","Year: "+rpLabel());
  function line(it,o){
    var tl=timeLabel(it),when=(o.date&&it.date?shortDay(it.date)+(tl?", ":""):"")+tl;
    var l="- "+(when?when+" – ":"")+(o.type?TYPES[it.type].label+": ":"")+it.title;
    var tail=[];if(it.person)tail.push(it.person);if(it.note)tail.push(it.note);
    tail.push(PRIO[prio(it)]);if(o.status)tail.push(STATUS[it.status]);
    return l+" | "+tail.join(" | ");
  }
  function sec(n,title,list,o){L.push("","*"+n+". "+title+"*");if(!list.length)L.push("- No records");else list.forEach(function(i){L.push(line(i,o))})}
  var ty=function(t){return recs.filter(function(i){return i.type===t})};
  sec(1,"COMPLETED WORK",recs.filter(function(i){return i.status==="done"}),{type:true,date:multi});
  sec(2,"PENDING WORK",recs.filter(function(i){return i.type==="task"&&i.status!=="done"}),{date:multi,status:true});
  sec(3,"CALLS",ty("call"),{date:multi,status:true});
  sec(4,"MEETINGS",ty("meeting"),{date:multi,status:true});
  sec(5,"SITE VISITS",ty("visit"),{date:multi,status:true});
  sec(6,"FOLLOW-UPS",ty("followup"),{date:multi,status:true});
  var nd=addDays(parse(g[1]),1),nk=ymd(nd);
  var next=st.items.filter(function(i){return i.date===nk&&i.status!=="done"&&(r.module==="all"||i.type===r.module)}).sort(function(a,b){return PRANK[prio(a)]-PRANK[prio(b)]||cmp(a,b)});
  sec(7,"NEXT-DAY PRIORITIES ("+shortDate(nk)+")",next,{type:true});
  L.push("","*SUMMARY*","- Tasks completed: "+sm.taskDone,"- Tasks pending: "+sm.taskPend,"- Calls: "+sm.calls+" (completed "+sm.callsDone+")","- Meetings: "+sm.meetings,"- Site visits: "+sm.visits,"- Follow-ups: "+sm.followups,"- Overdue items: "+sm.overdue);
  return L.join("\n");
}
function planText(){
  var now=nowIST(),today=ymd(now),n=0,L=[];
  function line(it,withSince){
    n++;var tl=timeLabel(it),t=TYPES[it.type]?TYPES[it.type].label:it.type;
    var ti=String(it.title||""),hasT=ti.toLowerCase().replace(/[^a-z]/g,"").indexOf(t.toLowerCase().replace(/[^a-z]/g,""))===0;
    var s=n+". "+(tl&&!withSince?tl+" – ":"")+(hasT?"":t+": ")+ti;
    if(it.person&&String(it.title||"").toLowerCase().indexOf(String(it.person).toLowerCase())<0)s+=" ("+it.person+")";
    if(withSince&&it.date&&it.date<today)s+=" (Pending since "+shortDay(it.date)+")";
    return s;
  }
  var A=st.items.filter(function(i){return i.date===today&&i.type!=="followup"}).sort(cmp);
  var B=st.items.filter(function(i){return i.status!=="done"&&((i.date&&i.date<today)||!i.date||(i.date===today&&i.type==="followup"))}).sort(function(a,b){

    case "closemodal":closeModal();break;
    case "qcgo":doCapture();break;
    case "qcfill":$("#qc").value=el.dataset.v;qcParse();qcMsg("","");qcRenderPreview();$("#qc").focus();break;
    case "qcedit":if(!qcNeedsConfirm())st.qc.edit=!st.qc.edit;qcRenderPreview();break;
    case "qcalt":st.qc.ov.date=el.dataset.d;qcRenderPreview();break;
    case "delask":
      if(el.classList.contains("armed")){if(!needDb())return;st.db.doc("items/"+id).delete().then(function(){st.items=st.items.filter(function(x){return x.id!==id});closeModal();toast("Deleted");render()}).catch(function(er){setErr("Could not delete ("+(er&&(er.message||er.code)||"error")+")")})}
      else{el.classList.add("armed");el.textContent="Tap again to delete"}
      break;
    case "rpmode":st.rp.mode=el.dataset.v;render();break;
    case "wa":openWA();break;
    case "plan":openPlan();break;
    case "plancopy":
      var ptxt=planText().txt;
      var psel=function(){var pre=$("#waTxt"),r=document.createRange();r.selectNodeContents(pre);var s=window.getSelection();s.removeAllRanges();s.addRange(r);toast("Select and copy the text")};
      try{navigator.clipboard.writeText(ptxt).then(function(){toast("Plan copied")},psel)}catch(er){psel()}
      break;
    case "wacopy":
      var txt=waText();
      var sel=function(){var pre=$("#waTxt"),r=document.createRange();r.selectNodeContents(pre);var s=window.getSelection();s.removeAllRanges();s.addRange(r);toast("Select and copy the text")};
      try{navigator.clipboard.writeText(txt).then(function(){toast("Report copied")},sel)}catch(er){sel()}
      break;
    case "xlsx":exportXlsx();break;
    case "csv":exportCsv();break;
    case "saveprefs":
      if(!needDb())break;
      var nm=$("#setName").value.trim()||"Sanju",ow=$("#setOwner").value.trim()||nm,ls=$("#setLead"),nl=ls?Number(ls.value):lead(),oldL=lead();
      st.db.doc("settings/profile").set({name:nm,owner:ow,lead:nl}).then(function(){
        st.settings={name:nm,owner:ow,lead:nl};
        if(nl!==oldL&&st.db.recomputeReminders)return st.db.recomputeReminders().then(function(n){toast2("Saved. "+(n?n+" reminder"+(n>1?"s":"")+" updated.":"")||"Saved")});
        toast2("Saved");
      }).catch(function(er){toast2("Not saved: "+((er&&(er.message||er.code))||"error"),true)});break;
    case "authmode":showAuth("",{mode:el.dataset.v});break;
    case "enpush":enablePush();break;
    case "dispush":disablePush();break;
    case "testlocal":testLocal();break;
    case "testserver":testServer();break;
    case "install":doInstall();break;
    case "signout":signOut();break;
    case "export":exportBackup();break;
    case "import":var fi=$("#impFile");if(fi)fi.click();break;
    case "clearex":
      if(!needDb())break;
      var ids=st.items.filter(function(i){return i.example}).map(function(i){return i.id});
      ids.reduce(function(p,i){return p.then(function(){return st.db.doc("items/"+i).delete()})},Promise.resolve()).then(function(){toast("Examples removed")}).catch(function(er){toast("Could not remove ("+(er&&(er.message||er.code)||"error")+")")});break;
  }
}
document.addEventListener("click",function(e){
  if(e.target.id==="modal"){closeModal();return}
  var el=e.target.closest("[data-act]");
  if(st.menu&&!e.target.closest("#pop")&&!(el&&el.dataset.act==="menu"))closeMenu();
  if(el)act(el,e);
});
window.addEventListener("scroll",function(e){if(st.menu&&Date.now()-st.menuAt>400&&!(e.target.closest&&e.target.closest("#pop")))closeMenu()},true);window.addEventListener("resize",function(){if(st.menu&&Date.now()-st.menuAt>400)closeMenu()});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){if(st.menu){var kb=document.querySelector('[data-act="menu"][data-id="'+st.menu.split(":")[1]+'"][data-kind="'+st.menu.split(":")[0]+'"]');closeMenu();if(kb)kb.focus();return}if(!$("#modal").hidden)closeModal();closeDrawer();return}
  if(st.menu&&(e.key==="ArrowDown"||e.key==="ArrowUp")){e.preventDefault();var bs=[].slice.call(document.querySelectorAll("#pop button")),ix=bs.indexOf(document.activeElement);ix=e.key==="ArrowDown"?(ix+1)%bs.length:(ix-1+bs.length)%bs.length;bs[ix].focus();return}
  if((e.ctrlKey||e.metaKey)&&(e.key==="k"||e.key==="K")){e.preventDefault();if(st.view!=="dashboard"){go("dashboard")}setTimeout(function(){$("#qc").focus()},40);return}
  if(e.target.id==="qc"&&e.key==="Enter"){e.preventDefault();doCapture();return}
  if((e.key==="Enter"||e.key===" ")&&e.target.getAttribute&&e.target.getAttribute("role")==="button"&&e.target.dataset.act){e.preventDefault();act(e.target,e)}
});
document.addEventListener("input",function(e){
  var id=e.target.id;if(id==="auEmail")st.auth.email=e.target.value;
  if(id==="qc"){qcParse();qcMsg("","");qcRenderPreview()}
  else if(/^qp(Type|Title|Person|Date|Time)$/.test(id)){
    var key=id.slice(2).toLowerCase();st.qc.ov[key]=e.target.value;
    if(key==="type"||key==="date")qcRenderPreview();
    else{var sm=$("#qpSum");if(sm){var btn=sm.querySelector(".qedit");sm.innerHTML=qcSummary()+(btn?btn.outerHTML:"")}}
  }
  if(id==="rpQ"){st.rp.q=e.target.value;$("#rpBody").innerHTML=rpBody()}
});
document.addEventListener("submit",function(e){if(e.target.id==="authForm"){e.preventDefault();submitAuth()}});
document.addEventListener("change",function(e){
  var id=e.target.id,v=e.target.value,r=st.rp;
  if(id==="impFile"){importBackup(e.target.files&&e.target.files[0]);e.target.value="";return}
  if(id==="rpDate"&&v){r.date=v;render()}
  else if(id==="rpFrom"&&v){r.from=v;render()}
  else if(id==="rpTo"&&v){r.to=v;render()}
  else if(id==="rpMonth"&&v){r.month=v;render()}
  else if(id==="rpYear"){r.year=Number(v);render()}
  else if(id==="rpModule"){r.module=v;render()}
  else if(id==="rpStatus"){r.status=v;render()}
});

/* ---------- start ---------- */
$("#qcTry").innerHTML="Try: "+SAMPLES.map(function(t){return '<button class="chip" data-act="qcfill" data-v="'+esc(t)+'">'+esc(t)+'</button>'}).join("");
readHash();render();qcRenderPreview();
var lastPer=periodOf(nowIST().getHours());
setInterval(function(){var p=periodOf(nowIST().getHours());updateChrome();if(p!==lastPer){lastPer=p;rerender()}},30000);
boot();
})();
</script>
